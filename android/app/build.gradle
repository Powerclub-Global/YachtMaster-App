plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    compileSdkVersion 35

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.assorttech.yacht_master"
        namespace "com.assorttech.yacht_master"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    def keystorePath = System.getenv("STORE_FILE") ?: project.findProperty("storeFile")
    def keystorePassword = System.getenv("STORE_PASSWORD") ?: project.findProperty("storePassword")
    def keyAliasValue = System.getenv("KEY_ALIAS") ?: project.findProperty("keyAlias")
    def keyPasswordValue = System.getenv("KEY_PASSWORD") ?: project.findProperty("keyPassword")
    def hasReleaseKeystore = [keystorePath, keystorePassword, keyAliasValue, keyPasswordValue]
        .every { it != null && !it.toString().trim().isEmpty() }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            if (!hasReleaseKeystore) {
                signingConfig signingConfigs.debug
                println "⚠️  Release keystore configuration missing. Using debug signing for release builds."
            }
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            zipAlignEnabled true
            shrinkResources true
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            } else {
                initWith signingConfigs.debug
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // constraints {
    //     implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
    //         because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
    //     }
    //     implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
    //         because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
    //     }

    // }
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
    implementation 'com.google.firebase:firebase-messaging:17.3.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "androidx.browser:browser:1.2.0"
    implementation 'androidx.multidex:multidex:2.0.1'
}
